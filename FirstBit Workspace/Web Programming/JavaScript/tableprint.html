<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border:2px solid red;
        }
        .MainContainer{
            display: flex;
            flex-wrap: wrap;
            gap:10px;
        }
        .even{
            background-color: lightblue;
            display: inline-block;
        }
        .odd{
            background-color: lightgreen;
            display: inline-block;
        }
    </style>
    <script>
        function printTable(){
            a=parseInt(document.getElementById("num1").value);
            b=parseInt(document.getElementById("num2").value);

            str="<div class='MainContainer'>";

            for(j=a; j<=b; j++){
                
                if(j%2==0){
                    cname="even";
                }
                else{
                    cname="odd";
                }
                
                tb=`<div class=${cname}><table>`
                for(i=1;i<=10;i++){
                    tb=tb+`<tr><td>${getImg(j)}</td><td>x</td><td>${getImg(i)}</td><td>=</td><td>${getImg2(j*i)}</td></tr>`
                }
                tb=tb+"</table></div>"

                str=str+tb;
            }

            str=str+"</div>";
            document.getElementById("result").innerHTML = str;
        }

        function getImg(j){
            if(j==7){
                return `<img src="IMG_20260410_191707.png" width="20px">`;
            }
            return j;
        }

        function getImg2(value){
    let num = value;
    let result = "";

    while(num > 0){
        let r = num % 10;

        if(r == 7){
            result = `<img src="IMG_20260410_191707.png" width="20px">` + result;
        } else {
            result = r + result;
        }

        num = Math.floor(num / 10);
    }

    return result;
}

        function reverse(value){

            rev = 0;

            while(value>0){
                r = value%10;
                rev = rev*10 + r;
                value = Math.floor(value/10);
            }

            return rev;
        }
    </script>
</head>
<body>
    Enter a number to start from <input type="text" id="num1">
    Enter a number to stop at <input type="text" id="num2">
    <br>
    <button onclick="printTable()">Print Table</button>
    <br>
    <span id="result"></span>
</body>
