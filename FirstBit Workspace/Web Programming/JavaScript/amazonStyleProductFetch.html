<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon | All your needs fullfil here</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <style>

    #products{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
        margin-top: 120px;
    }

    .eachProduct{
        border: 2px solid red;
        width: 350px;
        min-height: 600px;
        padding: 15px;
        text-align: center;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .carousel-inner img {
        width: 100%;
        height: 250px;
        object-fit: contain;
        border-radius: 8px;
        background-color: rgb(12, 158, 158);
    }

    #desc {
        margin-top: 15px;
        display: none;
        text-align: justify;
    }

    .eachProduct button {
        color: blue;
        background-color: white;
        border: none;
        margin-top: 10px;
        cursor: pointer;
        font-weight: bold;
    }

    #header-image{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
    }

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.2.1/axios.min.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            async function fetchProducts(){

                try{

                    response = await axios.get("https://dummyjson.com/products")

                    productArray = response.data.products

                    productsString = ""

                    for(i=0; i<productArray.length; i++){
                        currentProduct = productArray[i]

                        productsString += `
                            <div class="eachProduct"> 

                                <b> ${currentProduct.title} </b>
                                <br><br>
                                    <div id="carouselExampleControls${i}" class="carousel slide" data-ride="carousel">
                                        <div class="carousel-inner">
                                            <div class="carousel-item active">
                                            <img class="d-block w-100" src="${currentProduct.images[0]}" alt="First slide">
                                            </div>
                                            <div class="carousel-item">
                                            <img class="d-block w-100" src="https://hips.hearstapps.com/hmg-prod/images/gh-best-skincare-products-6557978b58b57.png?crop=1.00xw:1.00xh;0,0&resize=1800:*" alt="Second slide">
                                            </div>
                                            <div class="carousel-item">
                                            <img class="d-block w-100" src="${currentProduct.images[0]}" alt="Third slide">
                                            </div>
                                        </div>
                                        <a class="carousel-control-prev" href="#carouselExampleControls${i}" role="button" data-slide="prev">
                                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                            <span class="sr-only">Previous</span>
                                        </a>
                                        <a class="carousel-control-next" href="#carouselExampleControls${i}" role="button" data-slide="next">
                                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                            <span class="sr-only">Next</span>
                                        </a>
                                    </div>
                                <br>
                                <strong>${currentProduct.price + " $"}</strong>
                                <br>
                                <p id="desc" style="display:none">${currentProduct.description}</p>
                                <br>
                                <button onclick="showDesc(this)">Show More</button>
                                <br>

                            </div>
                        `
                    }

                    document.getElementById('products').innerHTML = productsString

                }
                catch{
                    console.log("err")
                }
                
            }

            fetchProducts()
        })

         function showDesc(btn){
        
            descToShow = btn.previousElementSibling.previousElementSibling

            if(descToShow.style.display === 'none'){
                descToShow.style.display = 'block'
                btn.innerHTML = 'Show Less'
            }
            else{
                descToShow.style.display = 'none'
                btn.innerHTML = 'Show More'
            }
        }
    </script>
</head>
<body>

    <img id="header-image" src="amazon-header.png">
    <div id="products"></div>

</body>
</html
