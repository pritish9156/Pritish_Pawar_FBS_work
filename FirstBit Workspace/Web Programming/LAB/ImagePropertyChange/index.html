<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="main-image">
        <img src="Images/image1.jpg" width="200px" height="200px" alt="car" />

        <div class="edit-options">
            <label for="border">Border</label>
            <input type="checkbox" id="border">
            <label for="show-shape">click to change shap</label>
            <input type="checkbox" id="show-shape">
            <div id="show-shape-option">
                <label for="square">square</label>
                <input type="radio" id="square" name="shape">
                <label for="circle">circle</label>
                <input type="radio" id="circle" name="shape">
                <label for="octagone">Octagone</label>
                <input type="radio" id="octagone" name="shape">
            </div>
            <button id="apply-btn">Apply</button>
        </div>
    </div>
</body>
</html>
