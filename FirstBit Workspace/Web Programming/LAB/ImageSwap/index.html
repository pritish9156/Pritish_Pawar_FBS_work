<!DOCTYPE html>
<html>
<head>
    <title>Image Swap Layout</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <h2>Image Swap Project</h2>

    <!-- Big Image -->
    <div class="main-image">
        <img src="Images/image1.jpg" alt="Main Image">
    </div>

    <!-- Small Images Row -->
    <div class="image-row">
        <img src="Images/image2.jpg" alt="image1">
        <img src="Images/image3.jpg" alt="image2">
        <img src="Images/image4.jpg" alt="image3">
        <img src="Images/image5.jpg" alt="image4">
    </div>

</body>
</html>
